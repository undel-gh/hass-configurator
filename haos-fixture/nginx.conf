# Temporary HA OS Ingress validation proxy. Do not expose a host port.
# Official bridged Supervisor Ingress peer: 172.30.32.2.
worker_processes 1;
pid /tmp/hc-ingress-nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;

    client_max_body_size 105m;

    # Suppress legacy privileged handlers; full hardening remains issue #7.
    location ~ ^/api/(exec_command|gitadd|gitdiff|commit|checkout|newbranch|init|push|stash|restart|check_config|reload_automations|reload_scripts|reload_groups|reload_core|allowed_networks|banned_ips)$ {
      return 403;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # Forward only on the Supervisor-allowlisted peer. The legacy app
      # ignores this header and does NOT treat it as authoritative.
      # Actual Supervisor sanitization/trusted-header semantics are #8 P1.
      proxy_set_header X-Ingress-Path $http_x_ingress_path;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_pass http://127.0.0.1:3218;
    }
  }
}
