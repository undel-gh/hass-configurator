# Isolated test app ONLY. There is no public host port.
# Supervisor's documented ingress bridge peer is 172.30.32.2.
# We do not authenticate requests from XFF/X-Ingress-Path/user headers.
worker_processes 1;
pid /tmp/hc-ingress-nginx.pid;
events { worker_connections 256; }
http {
  access_log off;

  # Diagnostic returns ONLY an enum, never the opaque Ingress prefix/token.
  # The Supervisor is expected to overwrite X-Ingress-Path even if an
  # authenticated browser supplies an injected value.
  map $http_x_ingress_path $hc_ingress_path_status {
    default "invalid";
    ~^/api/hassio_ingress/[a-zA-Z0-9_-]+$ "valid";
  }
  map $http_x_remote_user_id $hc_user_id_present {
    default "yes";
    "" "no";
  }

  server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;

    client_max_body_size 105m;

    # A deliberately separate fixture-owned diagnostic endpoint. It proxies
    # through nginx access-phase ACLs and the real Python /api/version route.
    # Do NOT use "return 200" here: nginx rewrite-phase return could bypass
    # the server-level Supervisor IP access checks.
    location = /__haos_probe {
      add_header Cache-Control "no-store" always;
      add_header X-HC-Fixture-Id "hc-ingress-validation-v1" always;
      add_header X-HC-Ingress-Path-Status $hc_ingress_path_status always;
      add_header X-HC-User-Id-Present $hc_user_id_present always;
      proxy_set_header Host 127.0.0.1:3218;
      proxy_set_header X-Ingress-Path "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Remote-User-Id "";
      proxy_set_header X-Remote-User-Name "";
      proxy_set_header X-Remote-User-Display-Name "";
      proxy_pass http://127.0.0.1:3218/api/version;
    }

    # Defence in depth; these are also denied by #7's API policy.
    location ~ ^/api/(exec_command|gitadd|gitdiff|commit|checkout|newbranch|init|push|stash|restart|check_config|reload_automations|reload_scripts|reload_groups|reload_core|allowed_networks|banned_ips)$ {
      return 403;
    }

    location / {
      proxy_http_version 1.1;
      # The Python process is local-only and correctly rejects external
      # authority/Host headers under #7. Never pass the browser's public Host
      # (or any untrusted forwarded identity) into its loopback auth shortcut.
      proxy_set_header Host 127.0.0.1:3218;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Ingress-Path "";
      proxy_set_header X-Remote-User-Id "";
      proxy_set_header X-Remote-User-Name "";
      proxy_set_header X-Remote-User-Display-Name "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_pass http://127.0.0.1:3218;
    }
  }
}
