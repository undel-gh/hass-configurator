name: Offline foundation

on:
  push:
    branches: [master, 'feat/offline-*']
  pull_request:

permissions:
  contents: read

jobs:
  hash-locked-docker-dependencies:
    name: P0 immutable Docker base and exact Python wheel closure
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      # On pull_request, default checkout is refs/pull/<n>/merge, not the
      # source commit whose local reproducibility the release record claims.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check pinned lock and official digest-pinned OS toolchain
        run: |
          set -euo pipefail
          BASE="docker.io/library/python:3.11.18-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6"
          python scripts/check_docker_runtime_lock.py --lock requirements/docker-runtime.lock
          docker pull --platform linux/amd64 "$BASE"
          docker run --rm --network none --platform linux/amd64 "$BASE" sh -ec \
            'git --version; ssh -V; test -f /etc/ssl/certs/ca-certificates.crt; python --version'
      - name: Resolve the complete dependency closure using ONLY reviewed SHA-256 wheels
        run: |
          set -euo pipefail
          BASE="docker.io/library/python:3.11.18-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo:ro" -w /tmp "$BASE" sh -ec '
              python -m pip download --disable-pip-version-check \
                --no-cache-dir --only-binary=:all: --require-hashes \
                -r /repo/requirements/docker-runtime.lock -d /tmp/p0-wheels
              python /repo/scripts/check_docker_runtime_lock.py \
                --lock /repo/requirements/docker-runtime.lock \
                --wheelhouse /tmp/p0-wheels
            '

  routing-and-inventory:
    name: Routing / inventory (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # On pull_request, default checkout is refs/pull/<n>/merge, not the
      # source commit whose local reproducibility the release record claims.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify static resource inventory
        run: python scripts/audit_runtime_assets.py --strict-offline
      - name: Inspect official Ace 1.45.2 archive and full build family
        run: |
          npm view ace-builds@1.45.2 dist.integrity dist.tarball --json
          npm pack ace-builds@1.45.2 --ignore-scripts --silent --pack-destination /tmp
          python scripts/verify_ace_archive.py /tmp/ace-builds-1.45.2.tgz
          npm pack materialize-css@0.100.2 --silent --pack-destination /tmp
          npm pack @mdi/font@3.4.93 --silent --pack-destination /tmp
          python scripts/vendor_offline_assets.py --verify-only \
            --ace /tmp/ace-builds-1.45.2.tgz \
            --materialize /tmp/materialize-css-0.100.2.tgz \
            --mdi /tmp/mdi-font-3.4.93.tgz
      - name: Verify notices and generate source SBOM / legacy provenance evidence
        run: |
          set -euo pipefail
          mkdir -p e2e/artifacts/supply-chain
          npm view jquery@3.6.0 dist.integrity dist.tarball --json > e2e/artifacts/supply-chain/jquery-registry.json
          npm view js-yaml@4.3.2 dist.integrity dist.tarball --json > e2e/artifacts/supply-chain/js-yaml-registry.json
          npm pack jquery@3.6.0 --ignore-scripts --silent --pack-destination /tmp
          npm pack js-yaml@4.3.2 --ignore-scripts --silent --pack-destination /tmp
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/Dogfalo/materialize/9bc43a1199ad5dfb78d58ba47726ab039218a939/dist/js/materialize.min.js' -o /tmp/materialize-tag.js
          # Audit-only tooling, not added to the package/image dependencies.
          python -m pip install --disable-pip-version-check fonttools==4.60.1 brotli==1.1.0
          python scripts/audit_supply_chain.py source \
            --output e2e/artifacts/supply-chain/source.cdx.json --archives /tmp --fonts --embedded-upstream
      - name: Bounded regression probes against shipped js-yaml
        run: node e2e/yaml-migration-probe.cjs hass_configurator/js-yaml.min.js
      - name: Routing and loopback HTTP tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build distribution artifacts and validate vendored payloads
        run: |
          mkdir -p /tmp/vendor-wheel /tmp/vendor-sdist
          python -m pip wheel --no-deps --wheel-dir /tmp/vendor-wheel .
          python setup.py sdist --dist-dir /tmp/vendor-sdist
          python scripts/check_offline_artifacts.py /tmp/vendor-wheel /tmp/vendor-sdist

      - name: Upload source supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-source
          path: e2e/artifacts/supply-chain/
          if-no-files-found: error

  disposable-haos-fixture:
    name: Disposable HA OS app container smoke (NOT real Supervisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      # On pull_request, default checkout is refs/pull/<n>/merge, not the
      # source commit whose local reproducibility the release record claims.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate a private non-root Ingress app fixture
        run: python scripts/prepare_haos_ingress_fixture.py --output /tmp/hc-ingress-fixture
      - name: Build and boot temporary container
        run: |
          set -euo pipefail
          docker build --tag hc-ingress-e2e:pr /tmp/hc-ingress-fixture
          docker run --detach --rm --name hc-ingress-e2e hc-ingress-e2e:pr
          trap 'docker rm -f hc-ingress-e2e 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if docker exec hc-ingress-e2e python -c \
              'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:3218/api/prefs",timeout=2).status == 200' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs hc-ingress-e2e
            exit 1
          fi
          # Direct calls to the nginx Ingress port from localhost MUST be
          # rejected. Only bridged Supervisor peer 172.30.32.2 is allowed.
          docker exec -i hc-ingress-e2e python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          for path in ("/", "/api/prefs", "/__haos_probe", "/__haos_api_probe"):
              forged = Request("http://127.0.0.1:8099" + path,
                               headers={"X-Ingress-Path": "/api/hassio_ingress/forged",
                                        "X-Remote-User-Id": "fake-admin",
                                        "X-Forwarded-For": "172.30.32.2"})
              try:
                  urlopen(forged, timeout=3)
              except HTTPError as error:
                  assert error.code == 403, (path, error.code)
              else:
                  raise AssertionError("non-Supervisor peer reached Ingress: " + path)
          PY
          test -z "$(docker inspect --format '{{json .HostConfig.PortBindings}}' hc-ingress-e2e | tr -d 'null{}')"
          # Simulate only the *network address* of the documented Supervisor
          # bridge, without a real HA OS session, browser or forwarded headers.
          # Never treat this as HAOS-09/AT-11 live evidence.
          docker network create --driver bridge --subnet 172.30.32.0/24 hc-supervisor-ci
          trap 'docker rm -f hc-ingress-e2e 2>/dev/null || true; docker network rm hc-supervisor-ci 2>/dev/null || true' EXIT
          # Reserve .2 for the synthetic Supervisor client, not the app.
          docker network connect --ip 172.30.32.3 hc-supervisor-ci hc-ingress-e2e
          docker run --rm -i --network hc-supervisor-ci --ip 172.30.32.2 \
            --entrypoint python hc-ingress-e2e:pr - <<'PY'
          import http.client
          import json
          import re
          from urllib.parse import quote, urlencode
          conn = http.client.HTTPConnection("hc-ingress-e2e", 8099, timeout=5)
          try:
              # Deliberately malformed client-provided identity/Host headers
              # must not be interpreted as editor authentication at backend.
              spoof = {"Host": "attacker.example.invalid",
                       "X-Ingress-Path": "/attacker-controlled",
                       "X-Remote-User-Id": "forged-browser-identity",
                       "X-Forwarded-For": "203.0.113.9"}
              conn.request("GET", "/api/prefs", headers=spoof)
              reply = conn.getresponse()
              assert reply.status == 200, reply.status
              assert reply.getheader("Cache-Control") == "no-store"
              reply.read()
              conn.request("GET", "/__haos_probe", headers=spoof)
              probe = conn.getresponse()
              assert probe.status == 200, probe.status
              assert probe.getheader("X-HC-Fixture-Id") == "hc-ingress-validation-v1"
              assert probe.getheader("X-HC-Ingress-Path-Status") == "invalid"
              assert probe.getheader("X-HC-User-Id-Status") == "spoofed"
              probe.read()
              # Full API round-trip through nginx, including CSRF and a
              # Content-Length-bound POST. Uses only a disposable /data root.
              conn.request("GET", "/", headers=spoof)
              html_reply = conn.getresponse()
              assert html_reply.status == 200, html_reply.status
              html = html_reply.read().decode("utf-8")
              match = re.search(r'<meta name="hc-csrf-token" content="([^"]+)"', html)
              assert match, "No CSRF bootstrap in backend HTML"
              target = "/data/hc-ingress-validation/ci-proxy-roundtrip.yaml"
              payload = urlencode({"filename": target,
                                   "text": "ingress_probe: true\n"}).encode()
              conn.request("POST", "/api/save", body=payload, headers={
                  **spoof,
                  "X-CSRF-Token": match.group(1),
                  "Content-Type": "application/x-www-form-urlencoded",
              })
              saved = conn.getresponse()
              assert saved.status == 200, saved.status
              assert json.loads(saved.read())["error"] is False
              conn.request("GET", "/api/download?filename=" + quote(target, safe=""),
                           headers=spoof)
              downloaded = conn.getresponse()
              assert downloaded.status == 200, downloaded.status
              assert downloaded.read() == b"ingress_probe: true\n"
              # Exercise the actual streamed-body shape that Supervisor may
              # use under ingress_stream: true. Nginx must buffer/dechunk it
              # into a Content-Length request for the legacy Python handler.
              target_chunked = "/data/hc-ingress-validation/ci-chunked.yaml"
              upload = urlencode({"filename": target_chunked,
                                  "text": "chunked: works"}).encode()
              chunks = (upload[:9], upload[9:23], upload[23:])
              conn.request("POST", "/api/save", body=chunks, headers={
                  **spoof, "X-CSRF-Token": match.group(1),
                  "Content-Type": "application/x-www-form-urlencoded",
              }, encode_chunked=True)
              chunked_reply = conn.getresponse()
              assert chunked_reply.status == 200, chunked_reply.status
              assert json.loads(chunked_reply.read())["error"] is False
              conn.request("GET", "/api/download?filename=" + quote(target_chunked, safe=""),
                           headers=spoof)
              verify = conn.getresponse()
              assert verify.status == 200, verify.status
              assert verify.read() == b"chunked: works"
          finally:
              conn.close()
          PY

  early-browser-smoke:
    name: Network-attempt smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_WORKSPACE: /tmp/hass-configurator-e2e-sandbox
    steps:
      # On pull_request, default checkout is refs/pull/<n>/merge, not the
      # source commit whose local reproducibility the release record claims.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Correlate pinned Ace build with historical candidate evidence
        run: |
          set -euo pipefail
          mkdir -p e2e/artifacts/supply-chain
          npm view ace-builds@1.45.2 dist.integrity dist.tarball --json > /tmp/ace-candidate-registry.json
          npm pack ace-builds@1.45.2 --ignore-scripts --silent --pack-destination /tmp
          python scripts/inspect_ace_candidate.py --archive /tmp/ace-builds-1.45.2.tgz \
            --registry /tmp/ace-candidate-registry.json --output e2e/artifacts/supply-chain/ace-candidate.json \
            --extract /tmp/hc-ace-candidate-1.45.2
          node e2e/ace-candidate-smoke.cjs /tmp/hc-ace-candidate-1.45.2 e2e/artifacts/supply-chain/ace-candidate-browser.json
      - name: Start standalone editor
        run: |
          mkdir -p "$E2E_WORKSPACE"
          python -m hass_configurator.configurator --standalone --listen 127.0.0.1 --port 3218 --basepath "$E2E_WORKSPACE" --enforce > /tmp/configurator.log 2>&1 &
          echo $! > /tmp/configurator.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3218/api/prefs >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/configurator.log
          exit 1
      - name: Check manual HA OS browser suite parses without secrets
        run: node --check e2e/haos-real.spec.cjs
      - name: Full browser E2E matrix (disposable workspace)
        working-directory: e2e
        run: npm test
      - name: Browser gate against installed wheel and installed sdist
        run: |
          set -euo pipefail
          mkdir -p /tmp/hc-artifacts
          python -m pip wheel --no-deps --wheel-dir /tmp/hc-artifacts .
          python setup.py sdist --dist-dir /tmp/hc-artifacts
          for variant in wheel sdist; do
            venv="/tmp/hc-installed-$variant"
            python -m venv "$venv"
            if [ "$variant" = wheel ]; then
              artifact=$(find /tmp/hc-artifacts -maxdepth 1 -name '*.whl' -print -quit)
              port=3219
            else
              artifact=$(find /tmp/hc-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)
              port=3220
            fi
            "$venv/bin/pip" install --disable-pip-version-check "$artifact"
            mkdir -p "$PWD/e2e/artifacts/supply-chain"
            checkout="$PWD"
            (cd /tmp; "$venv/bin/python" "$checkout/scripts/audit_supply_chain.py" installed \
              --label "$variant" --output "$checkout/e2e/artifacts/supply-chain/$variant-installed.json")
            work="/tmp/hc-installed-workspace-$variant"
            mkdir -p "$work"
            # Import and start the installed package from OUTSIDE checkout.
            # A subprocess cwd at the repository root would silently choose
            # ./hass_configurator instead of venv/site-packages.
            (
              cd "$work"
              "$venv/bin/python" -c 'import sys, pathlib, hass_configurator; from hass_configurator import configurator; p=pathlib.Path(sys.prefix).resolve(); files=[pathlib.Path(hass_configurator.__file__).resolve(), pathlib.Path(configurator.__file__).resolve()]; assert all(f.is_relative_to(p) for f in files), files; print("Installed runtime origin:", files[-1], flush=True)' 
              exec "$venv/bin/python" -m hass_configurator.configurator \
                --standalone --listen 127.0.0.1 --port "$port" \
                --basepath "$work" --enforce
            ) > "/tmp/hc-installed-$variant.log" 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            ready=0
            for n in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/api/prefs" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "/tmp/hc-installed-$variant.log"
              exit 1
            fi
            # Preserve import origin in the public CI log for audit.
            grep -F "Installed runtime origin: $venv/" "/tmp/hc-installed-$variant.log"
            (
              cd e2e
              EDITOR_URL="http://127.0.0.1:$port" \
              E2E_WORKSPACE="$work" E2E_PYTHON="$venv/bin/python" \
                npm test -- --grep 'full UI attempts|real HTML resolves|Ace modes, themes|file browser|release identity'
            )
            kill "$app_pid"
            wait "$app_pid" || true
            trap - EXIT
          done
      - name: Build fork Docker image, verify identity offline, test real container browser
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Two independent BuildKit builds WITHOUT layer cache, from one
          # reviewed commit and a fixed SOURCE_DATE_EPOCH.
          export DOCKER_BUILDKIT=1
          source_commit=$(git rev-parse HEAD)
          # Fail closed if Actions checked out the synthetic PR merge commit
          # rather than the exact reviewed PR HEAD (or push commit).
          if [ "$source_commit" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "ERROR: checked-out SHA does not match requested source commit" >&2
            exit 1
          fi
          epoch=$(git show -s --format=%ct "$source_commit")
          test "$epoch" -ge 315532800 && test "$epoch" -le 4102444800
          echo "Release source SHA=$source_commit SOURCE_DATE_EPOCH=$epoch"
          # SOURCE_DATE_EPOCH alone fixes OCI metadata but not layer file
          # timestamps. BuildKit's Docker exporter must explicitly rewrite
          # layer timestamps, otherwise independent image IDs drift.
          docker buildx build --no-cache --platform linux/amd64 \
            --output type=docker,rewrite-timestamp=true \
            --build-arg SOURCE_DATE_EPOCH="$epoch" \
            --tag hc-fork-p0:build-a .
          docker buildx build --no-cache --platform linux/amd64 \
            --output type=docker,rewrite-timestamp=true \
            --build-arg SOURCE_DATE_EPOCH="$epoch" \
            --tag hc-fork-p0:build-b .
          id_a=$(docker image inspect --format '{{.Id}}' hc-fork-p0:build-a)
          id_b=$(docker image inspect --format '{{.Id}}' hc-fork-p0:build-b)
          echo "Independent no-cache image IDs: A=$id_a B=$id_b"
          if [ "$id_a" != "$id_b" ]; then
            echo "ERROR: Clean builds produced different image IDs" >&2
            docker image inspect hc-fork-p0:build-a hc-fork-p0:build-b \
              --format '{{json .RootFS.Layers}}'
            # Inspect ONLY temporary test images; print first 12 differences
            # per layer, never raw file data or sensitive Ingress URLs.
            docker save hc-fork-p0:build-a -o /tmp/hc-image-a.tar
            docker save hc-fork-p0:build-b -o /tmp/hc-image-b.tar
            python scripts/diagnose_docker_layers.py \
              /tmp/hc-image-a.tar /tmp/hc-image-b.tar
            exit 1
          fi
          docker tag hc-fork-p0:build-a hc-fork-p0:ci
          # Nonsecret, machine-readable inventory for release provenance and
          # future #9 vulnerability/SBOM review; no credentials or Ingress URLs.
          mkdir -p e2e/artifacts
          {
            printf 'source_commit=%s\n' "$source_commit"
            printf 'event_source_commit=%s\n' "$EXPECTED_SOURCE_SHA"
            printf 'source_date_epoch=%s\n' "$epoch"
            printf 'image_id_a=%s\nimage_id_b=%s\n' "$id_a" "$id_b"
            printf 'base_index_digest=%s\n' \
              'sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6'
            sha256sum requirements/docker-runtime.lock
          } > e2e/artifacts/docker-build-provenance.txt
          docker run --rm --network none --entrypoint python hc-fork-p0:ci \
            -m pip freeze --all > e2e/artifacts/docker-python-packages.txt
          docker run --rm --network none --entrypoint dpkg-query hc-fork-p0:ci \
            -W | LC_ALL=C sort > e2e/artifacts/docker-os-packages.txt
          expected_version=$(python -c 'from hass_configurator._version import VERSION; print(VERSION)')
          expected_digest=$(python -c 'from hass_configurator.http_routing import Assets; print(Assets().version)')
          echo "Expected fork version=$expected_version static fingerprint=$expected_digest"

          # Verify the package installed FROM the fork-built wheel, not a
          # wheel retained in the final image. Network access is disabled
          # and imports must not resolve to the checkout.
          docker run --rm --network none -i \
            --env EXPECTED_VERSION="$expected_version" \
            --env EXPECTED_DIGEST="$expected_digest" \
            --entrypoint python hc-fork-p0:ci - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          from hass_configurator._version import VERSION
          from hass_configurator import configurator
          from hass_configurator.http_routing import Assets

          assert os.geteuid() == 10001, "Fork image must not run as root"
          assert os.getegid() == 10001, "Fork group must not be privileged"
          assert importlib.metadata.version("hass-configurator") == VERSION
          assert VERSION == os.environ["EXPECTED_VERSION"]
          assert Assets().version == os.environ["EXPECTED_DIGEST"]
          assert "site-packages" in str(Path(configurator.__file__).resolve())
          print(json.dumps({"fork_image_version": VERSION,
                            "fingerprint": Assets().version,
                            "imported_module": configurator.__file__}))
          PY

          docker run --rm --network none -v "$PWD:/repo:ro" \
            --workdir /tmp --entrypoint python hc-fork-p0:ci \
            /repo/scripts/check_docker_runtime_lock.py \
            --lock /repo/requirements/docker-runtime.lock --installed

          # The image remains networkless; JSON goes to stdout via a temporary
          # container file, not to a writable checkout bind mount.
          docker run --rm --network none -v "$PWD:/repo:ro" \
            --workdir /tmp --entrypoint sh hc-fork-p0:ci -ec '
              python /repo/scripts/audit_supply_chain.py installed --locked --debian12 \
                --label docker --output /tmp/docker-installed.json
              cat /tmp/docker-installed.json
            ' > e2e/artifacts/supply-chain/docker-installed.json

          # These are isolated, disposable test-only credentials, never
          # deployment secrets or credentials for a user's installation.
          basic_user=ci-local-review
          basic_password=ci-only-strong-password
          docker run --detach --rm --network none \
            -e HC_USERNAME="$basic_user" -e HC_PASSWORD="$basic_password" \
            --name hc-fork-p0-networkless hc-fork-p0:ci
          trap 'docker rm -f hc-fork-p0-networkless hc-fork-p0-browser 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if docker exec hc-fork-p0-networkless python -c \
              'import base64,json,urllib.request; c=base64.b64encode(b"ci-local-review:ci-only-strong-password").decode(); r=urllib.request.Request("http://127.0.0.1:3218/api/version",headers={"Authorization":"Basic "+c}); u=urllib.request.urlopen(r,timeout=2); assert u.status==200 and json.loads(u.read())["version"]' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { docker logs hc-fork-p0-networkless; exit 1; }
          docker rm -f hc-fork-p0-networkless
          mkdir -p /tmp/hc-fork-p0-sandbox
          # Disposable CI bind mount: host Playwright and container UID 10001
          # both write test fixtures. Do not apply these test permissions to
          # production configuration directories.
          chmod 0777 /tmp/hc-fork-p0-sandbox
          docker run --detach --rm --name hc-fork-p0-browser \
            -e HC_USERNAME="$basic_user" -e HC_PASSWORD="$basic_password" \
            -p 127.0.0.1:3221:3218 \
            -v /tmp/hc-fork-p0-sandbox:/config \
            hc-fork-p0:ci
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -u "$basic_user:$basic_password" http://127.0.0.1:3221/api/version >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { docker logs hc-fork-p0-browser; exit 1; }
          (
            cd e2e
            EDITOR_URL=http://127.0.0.1:3221 \
            E2E_BASIC_USER="$basic_user" E2E_BASIC_PASSWORD="$basic_password" \
            E2E_WORKSPACE=/tmp/hc-fork-p0-sandbox \
            E2E_CONTAINER_PATH=/config \
              npm test -- --grep 'fork-built Docker|full UI attempts|real HTML resolves|Ace modes, themes|release identity'
          )
          docker rm -f hc-fork-p0-browser
          trap - EXIT

      - name: Scan actual install inventories and locked dependencies with OSV
        run: |
          python scripts/audit_supply_chain.py scan \
            --installed e2e/artifacts/supply-chain/wheel-installed.json \
              e2e/artifacts/supply-chain/sdist-installed.json \
              e2e/artifacts/supply-chain/docker-installed.json \
            --output e2e/artifacts/supply-chain/osv.json

      - name: Store browser audit and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-foundation-e2e
          path: |
            e2e/artifacts/
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
