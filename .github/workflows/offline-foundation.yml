name: Offline foundation

on:
  push:
    branches: [master, 'feat/offline-*']
  pull_request:

permissions:
  contents: read

jobs:
  hash-locked-docker-dependencies:
    name: P0 immutable Docker base and exact Python wheel closure
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned lock and official digest-pinned OS toolchain
        run: |
          set -euo pipefail
          BASE="docker.io/library/python:3.11.18-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6"
          python scripts/check_docker_runtime_lock.py --lock requirements/docker-runtime.lock
          docker pull --platform linux/amd64 "$BASE"
          docker run --rm --network none --platform linux/amd64 "$BASE" sh -ec \
            'git --version; ssh -V; test -f /etc/ssl/certs/ca-certificates.crt; python --version'
      - name: Resolve the complete dependency closure using ONLY reviewed SHA-256 wheels
        run: |
          set -euo pipefail
          BASE="docker.io/library/python:3.11.18-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo:ro" -w /tmp "$BASE" sh -ec '
              python -m pip download --disable-pip-version-check \
                --no-cache-dir --only-binary=:all: --require-hashes \
                -r /repo/requirements/docker-runtime.lock -d /tmp/p0-wheels
              python /repo/scripts/check_docker_runtime_lock.py \
                --lock /repo/requirements/docker-runtime.lock \
                --wheelhouse /tmp/p0-wheels
            '

  routing-and-inventory:
    name: Routing / inventory (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify static resource inventory
        run: python scripts/audit_runtime_assets.py --strict-offline
      - name: Inspect official Ace 1.9.6 archive and full build family
        run: |
          npm view ace-builds@1.9.6 dist.integrity dist.tarball --json
          npm pack ace-builds@1.9.6 --silent --pack-destination /tmp
          python scripts/verify_ace_archive.py /tmp/ace-builds-1.9.6.tgz
          npm pack materialize-css@0.100.2 --silent --pack-destination /tmp
          npm pack @mdi/font@3.4.93 --silent --pack-destination /tmp
          python scripts/vendor_offline_assets.py --verify-only \
            --ace /tmp/ace-builds-1.9.6.tgz \
            --materialize /tmp/materialize-css-0.100.2.tgz \
            --mdi /tmp/mdi-font-3.4.93.tgz
      - name: Routing and loopback HTTP tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build distribution artifacts and validate vendored payloads
        run: |
          mkdir -p /tmp/vendor-wheel /tmp/vendor-sdist
          python -m pip wheel --no-deps --wheel-dir /tmp/vendor-wheel .
          python setup.py sdist --dist-dir /tmp/vendor-sdist
          python scripts/check_offline_artifacts.py /tmp/vendor-wheel /tmp/vendor-sdist

  disposable-haos-fixture:
    name: Disposable HA OS app container smoke (NOT real Supervisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate a private non-root Ingress app fixture
        run: python scripts/prepare_haos_ingress_fixture.py --output /tmp/hc-ingress-fixture
      - name: Build and boot temporary container
        run: |
          set -euo pipefail
          docker build --tag hc-ingress-e2e:pr /tmp/hc-ingress-fixture
          docker run --detach --rm --name hc-ingress-e2e hc-ingress-e2e:pr
          trap 'docker rm -f hc-ingress-e2e 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if docker exec hc-ingress-e2e python -c \
              'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:3218/api/prefs",timeout=2).status == 200' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs hc-ingress-e2e
            exit 1
          fi
          # Direct calls to the nginx Ingress port from localhost MUST be
          # rejected. Only bridged Supervisor peer 172.30.32.2 is allowed.
          docker exec -i hc-ingress-e2e python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import urlopen

          try:
              urlopen("http://127.0.0.1:8099/", timeout=3)
          except HTTPError as error:
              assert error.code == 403, error.code
          else:
              raise AssertionError("non-Supervisor peer reached Ingress")
          PY
          test -z "$(docker inspect --format '{{json .HostConfig.PortBindings}}' hc-ingress-e2e | tr -d 'null{}')"

  early-browser-smoke:
    name: Network-attempt smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_WORKSPACE: /tmp/hass-configurator-e2e-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Start standalone editor
        run: |
          mkdir -p "$E2E_WORKSPACE"
          python -m hass_configurator.configurator --standalone --listen 127.0.0.1 --port 3218 --basepath "$E2E_WORKSPACE" --enforce > /tmp/configurator.log 2>&1 &
          echo $! > /tmp/configurator.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3218/api/prefs >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/configurator.log
          exit 1
      - name: Check manual HA OS browser suite parses without secrets
        run: node --check e2e/haos-real.spec.cjs
      - name: Full browser E2E matrix (disposable workspace)
        working-directory: e2e
        run: npm test
      - name: Browser gate against installed wheel and installed sdist
        run: |
          set -euo pipefail
          mkdir -p /tmp/hc-artifacts
          python -m pip wheel --no-deps --wheel-dir /tmp/hc-artifacts .
          python setup.py sdist --dist-dir /tmp/hc-artifacts
          for variant in wheel sdist; do
            venv="/tmp/hc-installed-$variant"
            python -m venv "$venv"
            if [ "$variant" = wheel ]; then
              artifact=$(find /tmp/hc-artifacts -maxdepth 1 -name '*.whl' -print -quit)
              port=3219
            else
              artifact=$(find /tmp/hc-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)
              port=3220
            fi
            "$venv/bin/pip" install --disable-pip-version-check "$artifact"
            work="/tmp/hc-installed-workspace-$variant"
            mkdir -p "$work"
            # Import and start the installed package from OUTSIDE checkout.
            # A subprocess cwd at the repository root would silently choose
            # ./hass_configurator instead of venv/site-packages.
            (
              cd "$work"
              "$venv/bin/python" -c 'import sys, pathlib, hass_configurator; from hass_configurator import configurator; p=pathlib.Path(sys.prefix).resolve(); files=[pathlib.Path(hass_configurator.__file__).resolve(), pathlib.Path(configurator.__file__).resolve()]; assert all(f.is_relative_to(p) for f in files), files; print("Installed runtime origin:", files[-1], flush=True)' 
              exec "$venv/bin/python" -m hass_configurator.configurator \
                --standalone --listen 127.0.0.1 --port "$port" \
                --basepath "$work" --enforce
            ) > "/tmp/hc-installed-$variant.log" 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            ready=0
            for n in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/api/prefs" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "/tmp/hc-installed-$variant.log"
              exit 1
            fi
            # Preserve import origin in the public CI log for audit.
            grep -F "Installed runtime origin: $venv/" "/tmp/hc-installed-$variant.log"
            (
              cd e2e
              EDITOR_URL="http://127.0.0.1:$port" \
              E2E_WORKSPACE="$work" E2E_PYTHON="$venv/bin/python" \
                npm test -- --grep 'full UI attempts|real HTML resolves|Ace modes, themes|file browser|release identity'
            )
            kill "$app_pid"
            wait "$app_pid" || true
            trap - EXIT
          done
      - name: Build fork Docker image, verify identity offline, test real container browser
        run: |
          set -euo pipefail
          # Two independent BuildKit builds WITHOUT layer cache, from one
          # reviewed commit and a fixed SOURCE_DATE_EPOCH.
          export DOCKER_BUILDKIT=1
          epoch=$(git log -1 --format=%ct)
          # SOURCE_DATE_EPOCH alone fixes OCI metadata but not layer file
          # timestamps. BuildKit's Docker exporter must explicitly rewrite
          # layer timestamps, otherwise independent image IDs drift.
          docker buildx build --no-cache --platform linux/amd64 \
            --output type=docker,rewrite-timestamp=true \
            --build-arg SOURCE_DATE_EPOCH="$epoch" \
            --tag hc-fork-p0:build-a .
          docker buildx build --no-cache --platform linux/amd64 \
            --output type=docker,rewrite-timestamp=true \
            --build-arg SOURCE_DATE_EPOCH="$epoch" \
            --tag hc-fork-p0:build-b .
          id_a=$(docker image inspect --format '{{.Id}}' hc-fork-p0:build-a)
          id_b=$(docker image inspect --format '{{.Id}}' hc-fork-p0:build-b)
          echo "Independent no-cache image IDs: A=$id_a B=$id_b"
          if [ "$id_a" != "$id_b" ]; then
            echo "ERROR: Clean builds produced different image IDs" >&2
            docker image inspect hc-fork-p0:build-a hc-fork-p0:build-b \
              --format '{{json .RootFS.Layers}}'
            exit 1
          fi
          docker tag hc-fork-p0:build-a hc-fork-p0:ci
          # Nonsecret, machine-readable inventory for release provenance and
          # future #9 vulnerability/SBOM review; no credentials or Ingress URLs.
          mkdir -p e2e/artifacts
          {
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_date_epoch=%s\n' "$epoch"
            printf 'image_id_a=%s\nimage_id_b=%s\n' "$id_a" "$id_b"
            printf 'base_index_digest=%s\n' \
              'sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6'
            sha256sum requirements/docker-runtime.lock
          } > e2e/artifacts/docker-build-provenance.txt
          docker run --rm --network none --entrypoint python hc-fork-p0:ci \
            -m pip freeze --all > e2e/artifacts/docker-python-packages.txt
          docker run --rm --network none --entrypoint dpkg-query hc-fork-p0:ci \
            -W | LC_ALL=C sort > e2e/artifacts/docker-os-packages.txt
          expected_version=$(python -c 'from hass_configurator._version import VERSION; print(VERSION)')
          expected_digest=$(python -c 'from hass_configurator.http_routing import Assets; print(Assets().version)')
          echo "Expected fork version=$expected_version static fingerprint=$expected_digest"

          # Verify the package installed FROM the fork-built wheel, not a
          # wheel retained in the final image. Network access is disabled
          # and imports must not resolve to the checkout.
          docker run --rm --network none -i \
            --env EXPECTED_VERSION="$expected_version" \
            --env EXPECTED_DIGEST="$expected_digest" \
            --entrypoint python hc-fork-p0:ci - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          from hass_configurator._version import VERSION
          from hass_configurator import configurator
          from hass_configurator.http_routing import Assets

          assert importlib.metadata.version("hass-configurator") == VERSION
          assert VERSION == os.environ["EXPECTED_VERSION"]
          assert Assets().version == os.environ["EXPECTED_DIGEST"]
          assert "site-packages" in str(Path(configurator.__file__).resolve())
          print(json.dumps({"fork_image_version": VERSION,
                            "fingerprint": Assets().version,
                            "imported_module": configurator.__file__}))
          PY

          docker run --rm --network none -v "$PWD:/repo:ro" \
            --workdir /tmp --entrypoint python hc-fork-p0:ci \
            /repo/scripts/check_docker_runtime_lock.py \
            --lock /repo/requirements/docker-runtime.lock --installed

          docker run --detach --rm --network none \
            --name hc-fork-p0-networkless hc-fork-p0:ci
          trap 'docker rm -f hc-fork-p0-networkless hc-fork-p0-browser 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if docker exec hc-fork-p0-networkless python -c \
              'import json,urllib.request; u=urllib.request.urlopen("http://127.0.0.1:3218/api/version",timeout=2); assert u.status==200 and json.loads(u.read())["version"]' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { docker logs hc-fork-p0-networkless; exit 1; }
          docker rm -f hc-fork-p0-networkless
          mkdir -p /tmp/hc-fork-p0-sandbox
          docker run --detach --rm --name hc-fork-p0-browser \
            -p 127.0.0.1:3221:3218 \
            -v /tmp/hc-fork-p0-sandbox:/config \
            hc-fork-p0:ci
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3221/api/version >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { docker logs hc-fork-p0-browser; exit 1; }
          (
            cd e2e
            EDITOR_URL=http://127.0.0.1:3221 \
            E2E_WORKSPACE=/tmp/hc-fork-p0-sandbox \
            E2E_CONTAINER_PATH=/config \
              npm test -- --grep 'fork-built Docker|full UI attempts|real HTML resolves|Ace modes, themes|release identity'
          )
          docker rm -f hc-fork-p0-browser
          trap - EXIT

      - name: Store browser audit and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-foundation-e2e
          path: |
            e2e/artifacts/
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
