name: Offline foundation

on:
  push:
    branches: [master, 'feat/offline-*']
  pull_request:

permissions:
  contents: read

jobs:
  routing-and-inventory:
    name: Routing / inventory (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify static resource inventory
        run: python scripts/audit_runtime_assets.py
      - name: Routing and loopback HTTP tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  early-browser-smoke:
    name: Network-attempt smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install browser test dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Start standalone editor
        run: |
          python -m hass_configurator.configurator --standalone --listen 127.0.0.1 --port 3218 > /tmp/configurator.log 2>&1 &
          echo $! > /tmp/configurator.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3218/api/prefs >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/configurator.log
          exit 1
      - name: Browser smoke and known offline debt
        working-directory: e2e
        run: npm test
      - name: Store browser audit and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-foundation-e2e
          path: |
            e2e/artifacts/
            e2e/test-results/
            e2e/playwright-report/
            /tmp/configurator.log
          if-no-files-found: ignore
