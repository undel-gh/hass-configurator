name: Bootstrap pinned offline vendor assets

on:
  push:
    branches: [feat/offline-vendored-ace-styles]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-vendor-bootstrap
  cancel-in-progress: false

jobs:
  vendor:
    # Idempotent bootstrap; a generated snapshot commit does not recurse.
    if: ${{ !contains(github.event.head_commit.message, '[vendor-snapshot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact published npm archives
        run: |
          npm pack ace-builds@1.9.6 --silent --pack-destination /tmp
          npm pack materialize-css@0.100.2 --silent --pack-destination /tmp
          npm pack @mdi/font@3.4.93 --silent --pack-destination /tmp
          node - <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const names={ace:'ace-builds@1.9.6',materialize:'materialize-css@0.100.2',mdi:'@mdi/font@3.4.93'};
          const sri={};
          for (const [key,pkg] of Object.entries(names)) {
            sri[key]=execFileSync('npm',['view',pkg,'dist.integrity'],{encoding:'utf8'}).trim();
            if (!sri[key].startsWith('sha512-')) throw new Error('Invalid SRI for '+pkg);
          }
          fs.writeFileSync('/tmp/vendor-sri.json', JSON.stringify(sri));
          NODE
      - name: Generate offline resources and validate tarball integrity
        run: |
          python scripts/vendor_offline_assets.py \
            --ace /tmp/ace-builds-1.9.6.tgz \
            --materialize /tmp/materialize-css-0.100.2.tgz \
            --mdi /tmp/mdi-font-3.4.93.tgz \
            --sri-file /tmp/vendor-sri.json
      - name: Commit generated assets to feature branch
        run: |
          git add hass_configurator/vendor
          if git diff --cached --quiet; then
            echo "Offline resource snapshot already matches checked-in vendor tree"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: pinned Ace, Materialize and MDI offline assets [vendor-snapshot]"
          git push origin HEAD:feat/offline-vendored-ace-styles
