name: One-time reviewed #33 runtime transfer
on:
  push:
    branches: [feat/p1-ace-yaml-remediation-issue-33]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'undel-gh/hass-configurator' && github.event.head_commit.message == 'chore: stage reviewed runtime transfer (#33)'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact reviewed runtime bytes and inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/hc-runtime-transfer
          npm view ace-builds@1.45.2 dist.integrity dist.tarball --json > /tmp/ace-registry.json
          npm view js-yaml@4.3.2 dist.integrity dist.tarball --json > /tmp/yaml-registry.json
          npm pack ace-builds@1.45.2 js-yaml@4.3.2 --ignore-scripts --silent --pack-destination /tmp
          python scripts/prepare_ace_migration.py --ace /tmp/ace-builds-1.45.2.tgz --ace-registry /tmp/ace-registry.json --yaml /tmp/js-yaml-4.3.2.tgz --yaml-registry /tmp/yaml-registry.json --dest /tmp/hc-runtime-overlay --report /tmp/hc-runtime-transfer/verified-input.json
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/mkslanc/ace-linters/e0d223c5a880cb2f258c96ccd22feaaffb29e5a5/packages/ace-legacy-linters/LICENSE' -o /tmp/linter-license.txt
          python scripts/promote_ace_yaml_once.py --overlay /tmp/hc-runtime-overlay --report /tmp/hc-runtime-transfer/verified-input.json --linter-license /tmp/linter-license.txt
          git -c core.autocrlf=false add -- hass_configurator/vendor/ace hass_configurator/vendor/licenses/ace.txt hass_configurator/vendor/manifest.json hass_configurator/js-yaml.min.js hass_configurator/third_party docs/ace-builds-1.45.2-lock.json docs/runtime-dependencies.json docs/history/ace-1.9.6-embedded.json docs/P1_SUPPLY_CHAIN.md docs/ACE_UPGRADE_RESEARCH.md docs/P1_ACE_YAML_MIGRATION.md scripts/vendor_offline_assets.py scripts/verify_ace_archive.py scripts/prepare_ace_migration.py tests/test_vendored_assets.py tests/test_p0_closeout.py tests/test_haos_fixture.py tests/test_supply_chain.py
          git diff --cached --binary --full-index > /tmp/hc-runtime-transfer/promotion.patch
          git diff --cached --stat > /tmp/hc-runtime-transfer/patch-stat.txt
          (cd /tmp/hc-runtime-transfer; sha256sum promotion.patch > patch.sha256)
      - name: Verify promoted source without publishing or writing repository
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python scripts/audit_runtime_assets.py --strict-offline
          python scripts/verify_ace_archive.py /tmp/ace-builds-1.45.2.tgz
          python scripts/audit_supply_chain.py source --output /tmp/hc-runtime-transfer/source.cdx.json
          node e2e/yaml-migration-probe.cjs hass_configurator/js-yaml.min.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-runtime-transfer
          path: /tmp/hc-runtime-transfer/
          if-no-files-found: error
  commit:
    needs: prepare
    if: github.repository == 'undel-gh/hass-configurator' && github.ref == 'refs/heads/feat/p1-ace-yaml-remediation-issue-33' && github.event.head_commit.message == 'chore: stage reviewed runtime transfer (#33)'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-runtime-transfer
          path: /tmp/hc-runtime-transfer
      - name: Apply only the verified migration patch to the exact feature branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref=refs/heads/feat/p1-ace-yaml-remediation-issue-33
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "$ref" | cut -f1)" = "$SOURCE_SHA"
          (cd /tmp/hc-runtime-transfer; sha256sum -c patch.sha256)
          git -c core.autocrlf=false apply --index --binary --whitespace=nowarn /tmp/hc-runtime-transfer/promotion.patch
          python - <<'PY'
          import subprocess
          allowed = {
              "hass_configurator/vendor/licenses/ace.txt", "hass_configurator/vendor/manifest.json",
              "hass_configurator/js-yaml.min.js", "hass_configurator/third_party/embedded.json",
              "hass_configurator/third_party/inventory.json", "hass_configurator/third_party/NOTICE.md",
              "hass_configurator/third_party/licenses/js-yaml.txt",
              "hass_configurator/third_party/licenses/embedded/ace-legacy-linters.txt",
              "docs/ace-builds-1.45.2-lock.json", "docs/runtime-dependencies.json",
              "docs/history/ace-1.9.6-embedded.json", "docs/P1_SUPPLY_CHAIN.md",
              "docs/ACE_UPGRADE_RESEARCH.md", "docs/P1_ACE_YAML_MIGRATION.md",
              "scripts/vendor_offline_assets.py", "scripts/verify_ace_archive.py",
              "scripts/prepare_ace_migration.py", "tests/test_vendored_assets.py",
              "tests/test_p0_closeout.py", "tests/test_haos_fixture.py", "tests/test_supply_chain.py",
          }
          paths = subprocess.check_output(["git","diff","--cached","--name-only","-z"]).decode().split("\0")[:-1]
          if not paths or any(p not in allowed and not p.startswith("hass_configurator/vendor/ace/") for p in paths):
              raise SystemExit("Unexpected staged path")
          for path in paths:
              staged = subprocess.check_output(["git","ls-files","-s","--",path], text=True)
              if not staged.startswith("100644 ") or len(staged.splitlines()) != 1:
                  raise SystemExit("Unexpected staged mode or deletion: " + path)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'vendor: promote reviewed Ace 1.45.2 and js-yaml 4.3.2 (#33)'
          git push origin "HEAD:$ref"
          git rev-parse HEAD
